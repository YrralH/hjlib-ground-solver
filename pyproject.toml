[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-ground-solver'
version = '0.1.0'
description = 'Ground-plane solving and derived ground-height estimation from body, keypoint, mesh, depth, and vanishing-direction observations.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'torch',
    'opencv-python',
    'trimesh',
    'scipy',
    'scikit-learn',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_ground_solver']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

[tool.hjlibm]
description_updated = '2026-08-25'

[tool.hjlibm.deps]
# Active runtime deps after dead-import cleanup (verified 2026-05-27, see docs/design/migration.md).
# hjlib-geometry: ground 'use' side (reverse_project, solve_ground_from_3_points,
#   get_depth_of_points_via_ground, convert_ground_parameters_to_4_verts_mesh_*, assert_is_rotmat).
# hjlib-smpl: SMPL_Full + skeleton helpers (get_rough_pillars_and_from_smpl_verts_batch,
#   get_2d_torso_center_from_2d_joint).
# camera-solver owns robust VP direction fusion; camera supplies the public K type.
# skeleton / vis-2d remain transitive via hjlib-smpl; NOT declared directly here.
hjlib-camera = { path = '../hjlib-camera', commit = 'a0071f8cc045d759f9c649f472ed198c2d61d04e' }
hjlib-camera-solver = { path = '../hjlib-camera-solver', commit = '8930b2922fafc0168e8cf0425559bdf3a9deb7ea' }
hjlib-geometry = { path = '../hjlib-geometry', commit = 'f42416fa2c42b84c0f6c48d47feee36bb9f8dd3d' }
hjlib-smpl = { path = '../hjlib-smpl', commit = 'e0ac0de62b2536ff8213c206e6fdf313728de862' }
