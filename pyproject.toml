[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-ground-solver'
version = '0.1.0'
description = 'Ground-plane solving and derived ground-height estimation from body, keypoint, mesh, and depth observations.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'torch',
    'opencv-python',
    'trimesh',
    'scipy',
    'scikit-learn',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_ground_solver']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

[tool.hjlibm]
description_updated = '2026-08-04'

[tool.hjlibm.deps]
# Active runtime deps after dead-import cleanup (verified 2026-05-27, see docs/design/migration.md).
# hjlib-geometry: ground 'use' side (reverse_project, solve_ground_from_3_points,
#   get_depth_of_points_via_ground, convert_ground_parameters_to_4_verts_mesh_*, assert_is_rotmat).
# hjlib-smpl: SMPL_Full + skeleton helpers (get_rough_pillars_and_from_smpl_verts_batch,
#   get_2d_torso_center_from_2d_joint).
# skeleton / camera / vis-2d remain transitive via hjlib-smpl; NOT declared directly here.
hjlib-geometry = { path = '../hjlib-geometry', commit = "fa42c836553e7f3a12ce9e264d64bfc9cf6b567f" }
hjlib-smpl = { path = '../hjlib-smpl', commit = "70ae4821163033413f013ad8839d6257252ff077" }
