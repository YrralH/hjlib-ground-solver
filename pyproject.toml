[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'hjlib-ground-solver'
version = '0.1.0'
description = 'Ground-plane solving side: estimate ground parameters / geometry from SMPL pillars, top-bottom keypoints, depth maps, and recover 3D info from 2D HVIP.'
requires-python = '>=3.12'
dependencies = [
    'numpy',
    'torch',
    'opencv-python',
    'trimesh',
    'scipy',
    'scikit-learn',
]

[tool.hatch.build.targets.wheel]
packages = ['src/hjlib_ground_solver']

[tool.pytest.ini_options]
testpaths = ['test_smoke', 'test']

[tool.hjlibm.deps]
# Active runtime deps after dead-import cleanup (verified 2026-05-27, see docs/design/migration.md).
# hjlib-geometry: ground 'use' side (reverse_project, solve_ground_from_3_points,
#   get_depth_of_points_via_ground, convert_ground_parameters_to_4_verts_mesh_*, assert_is_rotmat).
# hjlib-smpl: SMPL_Full + skeleton helpers (get_rough_pillars_and_from_smpl_verts_batch,
#   get_2d_torso_center_from_2d_joint).
# skeleton / camera / vis-2d remain transitive via hjlib-smpl; NOT declared directly here.
hjlib-geometry = { path = '../hjlib-geometry', commit = "4b633174b7fceacc25396040eb2b7147ba931e41" }
hjlib-smpl = { path = '../hjlib-smpl', commit = "5cbc2ce9f9438914b7f3fbce05b3cbe82315de67" }
